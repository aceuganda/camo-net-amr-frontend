apiVersion: apps/v1
kind: Deployment
metadata:
  name: amr-portal-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amr-portal
  template:
    metadata:
      labels:
        app: amr-portal
    spec:
      # Prefer amrdb but do not require it — the portal only needs to reach the API
      # over ClusterIP, so it stays schedulable elsewhere if amrdb is full or down.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - amrdb
      containers:
        - name: amr-portal-container
          image: khalifan1126/amr_portal:latest
          ports:
            - containerPort: 80
          imagePullPolicy: Always 
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: amr-portal-env-secrets
                  key: NEXT_PUBLIC_API_BASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: amr-portal-service
spec:
  selector:
    app: amr-portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
