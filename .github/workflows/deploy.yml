name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # id-token lets the runner mint a GitHub OIDC token; Teleport exchanges it
    # for short-lived kube credentials, so no long-lived KUBECONFIG secret is
    # stored in GitHub.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" >> .env
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: khalifan1126/amr_portal:latest

      # auth-k8s does not ship tbot; setup installs the Teleport binaries,
      # with `version: auto` matching whatever the proxy is running.
      - name: Fetch Teleport binaries
        uses: teleport-actions/setup@v1
        with:
          version: auto
          proxy: teleport.aceuganda.org:443

      # Exports KUBECONFIG for every later step, so the kubectl calls below
      # need no changes.
      - name: Fetch Teleport credentials
        uses: teleport-actions/auth-k8s@v2
        with:
          proxy: teleport.aceuganda.org:443
          token: github-actions-token
          kubernetes-cluster: amrdb

      - name: Create Kubernetes Secrets
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: amr-portal-env-secrets
          type: Opaque
          stringData:
            NEXT_PUBLIC_API_BASE_URL: "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}"
            SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
          EOF

      - name: Deploy frontend to Kubernetes
        run: |
          kubectl patch deployment amr-portal-deployment -p \
            "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date +'%Y-%m-%dT%H:%M:%S%z')\"}}}}}"
          
          kubectl apply -f k8s/amr_portal_deployment.yaml
